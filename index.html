<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diseño web con 3 cards animados y Resumen de Orden</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- CSS Externo -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center py-12 font-sans">

    <!-- Título Principal -->
    <h1 class="text-3xl md:text-4xl font-semibold text-gray-800 mb-12">
        Diseño web con 3 cards animados
    </h1>

    <!-- Contenedor de las Cards -->
    <div class="flex flex-col md:flex-row gap-8 items-center justify-center mb-20">

        <!-- Card 1 -->
        <a href="Page01/index.html" class="card-container">
            <div class="card-inner">
                <div class="card-front bg-blue-500 text-white shadow-lg rounded-2xl p-8 flex flex-col items-center justify-center">
                    <i data-lucide="layout-dashboard" class="w-12 h-12 mb-4"></i>
                    <span class="text-2xl font-bold tracking-wide">page1</span>
                </div>
                <div class="card-back bg-blue-700 text-white shadow-lg rounded-2xl p-8 flex flex-col items-center justify-center">
                    <i data-lucide="arrow-right-circle" class="w-12 h-12 mb-4"></i>
                    <span class="text-xl font-bold">Ir a Page01</span>
                </div>
            </div>
        </a>

        <!-- Card 2 -->
        <a href="Page02/index.html" class="card-container">
            <div class="card-inner">
                <div class="card-front bg-blue-500 text-white shadow-lg rounded-2xl p-8 flex flex-col items-center justify-center">
                    <i data-lucide="layers" class="w-12 h-12 mb-4"></i>
                    <span class="text-2xl font-bold tracking-wide">page2</span>
                </div>
                <div class="card-back bg-blue-700 text-white shadow-lg rounded-2xl p-8 flex flex-col items-center justify-center">
                    <i data-lucide="arrow-right-circle" class="w-12 h-12 mb-4"></i>
                    <span class="text-xl font-bold">Ir a Page02</span>
                </div>
            </div>
        </a>

        <!-- Card 3 -->
        <a href="Page03/index.html" class="card-container">
            <div class="card-inner">
                <div class="card-front bg-blue-500 text-white shadow-lg rounded-2xl p-8 flex flex-col items-center justify-center">
                    <i data-lucide="folder-kanban" class="w-12 h-12 mb-4"></i>
                    <span class="text-2xl font-bold tracking-wide">page3</span>
                </div>
                <div class="card-back bg-blue-700 text-white shadow-lg rounded-2xl p-8 flex flex-col items-center justify-center">
                    <i data-lucide="arrow-right-circle" class="w-12 h-12 mb-4"></i>
                    <span class="text-xl font-bold">Ir a Page03</span>
                </div>
            </div>
        </a>

    </div>

    <!-- Sección Inferior: Componente de Orden / Pasos con Estilo Oscuro -->
    <div class="w-full max-w-4xl bg-[#18181b] text-zinc-100 rounded-xl shadow-2xl p-6 md:p-8 border border-zinc-800">
        
        <!-- Barra superior de herramientas / botones de control simulados -->
        <div class="flex justify-between items-center mb-8 border-b border-zinc-800 pb-4">
            <div class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span>
                <span class="w-3 h-3 rounded-full bg-yellow-500 inline-block"></span>
                <span class="w-3 h-3 rounded-full bg-green-500 inline-block"></span>
            </div>
            <div class="flex items-center gap-4 text-zinc-400">
                <i data-lucide="sun" class="w-4 h-4 cursor-pointer hover:text-white"></i>
                <i data-lucide="monitor" class="w-4 h-4 cursor-pointer hover:text-white"></i>
                <i data-lucide="copy" class="w-4 h-4 cursor-pointer hover:text-white"></i>
                <i data-lucide="code" class="w-4 h-4 cursor-pointer hover:text-white"></i>
            </div>
        </div>

        <!-- Indicador de Pasos (Steps) -->
        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-10 text-xs md:text-sm text-zinc-400 border-b border-zinc-800 pb-6">
            <div class="flex items-center gap-2 text-white font-medium">
                <span class="w-6 h-6 rounded-full bg-zinc-200 text-zinc-900 flex items-center justify-center font-bold text-xs">1</span>
                Review Order
            </div>
            <div class="flex items-center gap-2">
                <span class="w-6 h-6 rounded-full bg-zinc-800 text-zinc-500 flex items-center justify-center font-bold text-xs">2</span>
                Select Shipping
            </div>
            <div class="flex items-center gap-2">
                <span class="w-6 h-6 rounded-full bg-zinc-800 text-zinc-500 flex items-center justify-center font-bold text-xs">3</span>
                Submit
            </div>
        </div>

        <!-- Título de Sección -->
        <h2 class="text-xl font-semibold mb-6 text-zinc-200">Order</h2>

        <!-- Tabla de Productos -->
        <div class="overflow-x-auto mb-8">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-zinc-800 text-zinc-400 text-sm">
                        <th class="py-3 font-medium">Description</th>
                        <th class="py-3 font-medium text-right">Quantity</th>
                        <th class="py-3 font-medium text-right">Price</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-zinc-800/60 text-sm text-zinc-300">
                    <tr>
                        <td class="py-4">Product 1</td>
                        <td class="py-4 text-right">2</td>
                        <td class="py-4 text-right">20</td>
                    </tr>
                    <tr>
                        <td class="py-4">Product 2</td>
                        <td class="py-4 text-right">10</td>
                        <td class="py-4 text-right">150</td>
                    </tr>
                    <tr class="font-semibold text-white">
                        <td class="py-4">Total</td>
                        <td class="py-4 text-right"></td>
                        <td class="py-4 text-right">$170</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Botones de Navegación Inferiores -->
        <div class="flex justify-between items-center pt-4">
            <button class="text-zinc-500 font-semibold tracking-wider text-xs hover:text-zinc-300 transition">
                PREVIOUS
            </button>
            <button class="bg-zinc-800 hover:bg-zinc-700 text-white px-5 py-2 rounded text-xs font-semibold tracking-wider transition border border-zinc-700">
                NEXT
            </button>
        </div>

    </div>

    <!-- Script para inicializar los íconos de Lucide -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
